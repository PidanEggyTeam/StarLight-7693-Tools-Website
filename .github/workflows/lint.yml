name: Lint & Build

# 质量门禁：oxlint（可能出错的地方）+ tsc（类型）+ 构建
#
# 部署已迁到 Cloudflare Workers：仓库不再保留 GitHub Pages 部署流水线，
# 也不再需要 pages: write / id-token: write 权限与 github-pages environment。
# 生产与预览部署由 Cloudflare 侧 Workers Builds 的 Git 集成自动执行，
# 所以这里除了 lint / 类型检查，还要自己把 next build 跑一遍：检查不过就不该发版。
#
# 排版检查（Prettier）已拆到独立的 prettier.yml，两者互不阻塞。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: oxlint + tsc + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint 先跑：任何 lint 报错都会让本 job 直接失败，
      # 后续 tsc 与 Build 步骤因此不会被触发（无需额外 if 条件）
      - name: oxlint
        run: pnpm run lint

      # 类型检查几秒出结果，不用等整次静态导出就能看到类型错误
      - name: TypeScript (tsc --noEmit)
        run: pnpm run typecheck

      # 同步字体 → next build → 产物校验：路由漏生成 / 字体漏同步都会直接失败
      - name: Build (sync-fonts + next build + verify-output → out/)
        run: pnpm run build
